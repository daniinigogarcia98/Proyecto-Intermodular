<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
  <head>
    <title>ForoMultitema-Registro</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <style>
    /* Ajustes responsive adicionales */
    @media (max-width: 575px) {
      .form-title-responsive {
        font-size: 1.5rem;
      }
      .card-responsive {
        padding: 1rem !important;
      }
      .input-group-text {
        font-size: 0.9rem;
      }
    }
  </style>

  <body class="bg-body-secondary">
    <div class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
          <div class="card shadow-sm card-responsive">
            <div class="card-body p-4 p-md-5">
              <h2 class="text-center mb-4 form-title-responsive">
                <i class="fas fa-user-plus me-2"></i>Crear Cuenta
              </h2>

              <form action="#" method="post">
                <!-- Campo: Nombre completo -->
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre completo</label>
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fas fa-user"></i
                    ></span>
                    <input
                      type="text"
                      class="form-control"
                      id="nombre"
                      name="nombre"
                      placeholder="Ej: Juan Pérez"
                      required
                      pattern="[\p{L}\s]+"
                      title="Solo letras y espacios"
                    />
                  </div>
                </div>

                <!-- Campo: Correo electrónico -->
                <div class="mb-3">
                  <label for="email" class="form-label"
                    >Correo electrónico</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fas fa-envelope"></i
                    ></span>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="email"
                      placeholder="tu@email.com"
                      required
                    />
                  </div>
                </div>

                <!-- Campo: Contraseña -->
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fas fa-lock"></i
                    ></span>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      placeholder="Mínimo 8 caracteres"
                      required
                      minlength="8"
                    />
                    <button
                      class="btn btn-outline-secondary"
                      type="button"
                      id="togglePassword"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- Campo: Confirmar contraseña -->
                <div class="mb-4">
                  <label for="confirmPassword" class="form-label"
                    >Repetir contraseña</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fas fa-lock"></i
                    ></span>
                    <input
                      type="password"
                      class="form-control"
                      id="confirmPassword"
                      name="confirmPassword"
                      placeholder="Confirmar contraseña"
                      required
                    />
                    <button
                      class="btn btn-outline-secondary"
                      type="button"
                      id="toggleConfirmPassword"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- Botones de acción -->
                <div
                  class="d-grid gap-2 d-sm-flex justify-content-sm-center mb-3"
                >
                  <button type="submit" class="btn btn-success w-100 w-sm-auto">
                    <i class="fas fa-check-circle me-2"></i>Registrarse
                  </button>
                  <button
                    type="reset"
                    class="btn btn-outline-danger w-100 w-sm-auto"
                  >
                    <i class="fas fa-times-circle me-2"></i>Cancelar
                  </button>
                </div>

                <!-- Enlace a inicio de sesión -->
                <div class="text-center">
                  <small class="text-muted">¿Ya tienes cuenta?</small><br />
                  <a
                    href="inicioSesion.html"
                    class="text-decoration-none fw-semibold"
                  >
                    Iniciar sesión <i class="fas fa-arrow-right small"></i>
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Scripts: Toggle contraseña y validación -->
    <script>
      // Toggle mostrar/ocultar contraseña
      function setupPasswordToggle(inputId, toggleId) {
        document
          .getElementById(toggleId)
          ?.addEventListener("click", function () {
            const input = document.getElementById(inputId);
            const icon = this.querySelector("i");
            if (input.type === "password") {
              input.type = "text";
              icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
              input.type = "password";
              icon.classList.replace("fa-eye-slash", "fa-eye");
            }
          });
      }
      setupPasswordToggle("password", "togglePassword");
      setupPasswordToggle("confirmPassword", "toggleConfirmPassword");

      // Validación simple de coincidencia de contraseñas
      document.querySelector("form")?.addEventListener("submit", function (e) {
        const pass = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;
        if (pass !== confirm) {
          e.preventDefault();
          alert("Las contraseñas no coinciden. Por favor, verifica.");
          document.getElementById("confirmPassword").focus();
        }
      });
    </script>
  </body>
</html>
