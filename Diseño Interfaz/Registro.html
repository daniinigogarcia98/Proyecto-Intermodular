<!doctype html>

<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"/>

  <title>Registro</title>
</head>

<body class="bg-body-secondary">

  <div class="container py-5">
    <div class="row justify-content-center">

  <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
    
    <div class="card shadow-sm">
      <div class="card-body p-4">

        <h2 class="text-center mb-4">
          <i class="fas fa-user-plus me-2"></i>Crear Cuenta
        </h2>

        <form action="#" method="post">

          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" placeholder="Ej: Juan Pérez">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input type="email" class="form-control" placeholder="tu@email.com">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" class="form-control" placeholder="Mínimo 8 Caracteres">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Repetir contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" class="form-control" placeholder="Confirmar contraseña">
            </div>
          </div>

          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <button class="btn btn-success w-100 w-sm-auto">
              <i class="fas fa-check-circle me-2"></i>Registrarse
            </button>
            <button class="btn btn-danger w-100 w-sm-auto">
               <i class="fas fa-times-circle me-2"></i>Cancelar
            </button>
          </div>
          <div class="text-center mb-4 mt-4">
            <a href="inicioSesion.html">¿Ya tienes Cuenta? Iniciar sesión</a>
         </div>
        </form>

      </div>
    </div>

  </div>

</div>

  </div>

</body>
</html>

    </div>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
  </body>
</html>
