<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>ForoMultitema-Crear Publicaciones</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
<style>
.admin-profile img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #dee2e6;
}

/* Ajustes responsive adicionales */
@media (max-width: 767px) {
  .admin-profile span {
    display: none; /* Ocultar nombre en móviles muy pequeños */
  }
  .navbar-brand {
    font-size: 1.1rem;
  }
}
</style>
  <body class="bg-body-secondary overflow-x-hidden">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-secondary" data-bs-theme="dark">
        <div class="container-fluid px-2 px-md-4">
          <a class="navbar-brand" href="#"> <i class="fas fa-layer-group me-2"></i>ForoMultitema</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <div class="container-fluid px-0">
              <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 w-100">
                  <!-- Grupo de Botones de Administración -->
                  <div class="d-flex gap-2 flex-wrap justify-content-center justify-content-lg-start">
                      <button class="btn btn-success btn-sm">
                          <i class="fas fa-newspaper"></i> <span class="d-none d-md-inline">Administrar Publicaciones</span>
                      </button>
                      <button class="btn btn-warning btn-sm">
                          <i class="fas fa-envelope-open-text"></i> <span class="d-none d-md-inline">Bandeja de Mensajes</span>
                      </button>
                  </div>

                  <!-- Perfil y Cerrar Sesión (Derecha) -->
                  <div class="ms-lg-auto d-flex align-items-center gap-2 gap-lg-3 justify-content-center justify-content-lg-end">
                      <a href="#" class="nav-link text-danger small">
                          <i class="fas fa-sign-out-alt me-1"></i> <span class="d-none d-sm-inline">Cerrar Sesión</span>
                      </a>
                      <div class="admin-profile d-flex align-items-center gap-2">
                          <span class="fw-bold text-white d-inline-block">Usuario</span>
                          <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" alt="Admin Avatar">
                      </div>
                  </div>
              </div>
          </div>
        </div>
        </div>
      </nav>
    </header>
    
    <main class="container-fluid px-0">
        <div class="container mt-4 mb-5">
            <div class="row justify-content-center">
              <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                  <div class="card-header bg-white py-3">
                    <h5 class="mb-0">Nueva Publicación</h5>
                  </div>
                  <div class="card-body">
                    <form>
                      <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">Título</label>
                        <input type="text" class="form-control" id="titulo" placeholder="Ej: Problema con..." required>
                      </div>
        
                      <div class="mb-3">
                        <label for="categoria" class="form-label fw-semibold">Categoría</label>
                        <select class="form-select" id="categoria">
                          <option value="1" selected>Informática</option>
                          <option value="2">Temas Varios</option>
                        </select>
                      </div>
        
                      <div class="mb-4">
                        <label for="contenido" class="form-label fw-semibold">Contenido</label>
                        <textarea class="form-control" id="contenido" rows="5" placeholder="Describe tu duda o aporte..." required></textarea>
                      </div>
        
                      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="categoria.html" class="btn btn-outline-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">Publicar</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
    </main>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
