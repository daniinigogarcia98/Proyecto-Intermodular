<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INFOFORO - Iniciar Sesión / Registro</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilosForo.css">
</head>
<body>

  <div class="container-fluid px-3 px-sm-4 py-4" style="max-width: 1400px;">
    
    <!-- Header -->
    <header class="header-bg p-3 mb-4 rounded-3">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1 class="h5 fw-bold text-white mb-0">INFOFORO</h1>

        <!-- Barra de búsqueda -->
        <div class="d-flex flex-grow-1 mx-md-3" style="max-width: 500px;">
          <input 
            type="text" 
            id="searchInput"
            class="search-box"
            placeholder="Buscar en categorías..."
          >
        </div>

        <!-- Botones de autenticación en desktop -->
        <div class="d-none d-md-flex align-items-center gap-2">
          <button class="btn btn-login btn-sm">Iniciar Sesión</button>
          <button class="btn btn-register btn-sm">Registrarse</button>
        </div>

        <!-- Hamburguesa en móvil -->
        <button 
          class="navbar-toggler d-md-none p-0" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#mobileMenu" 
          aria-label="Menú">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- Menú colapsable para móvil -->
      <div class="collapse mt-3 d-md-none" id="mobileMenu">
        <div class="mobile-menu">
          <div class="d-flex flex-column gap-2">
            
            <!-- Botones de autenticación en móvil -->
            <button class="btn btn-login btn-sm w-100">Iniciar Sesión</button>
            <button class="btn btn-register btn-sm w-100">Registrarse</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Tarjetas -->
    <div class="row g-4" id="cardsContainer">
      <div class="col-12 col-md-6 infoforo-card-item">
        <div class="card infoforo-card">
          <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1200&q=80" alt="Informática">
          <div class="card-body">
            <h5 class="card-title fw-bold">Informática</h5>
            <p class="card-text mb-0">
              Aquí podrás aportar tu granito de arena o simplemente buscar información sobre un problema...
            </p>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 infoforo-card-item">
        <div class="card infoforo-card">
          <img src="https://images.unsplash.com/photo-1581092580497-e0d23cbdf38c?auto=format&fit=crop&w=1200&q=80" alt="Temas Varios">
          <div class="card-body">
            <h5 class="card-title fw-bold">Temas Varios</h5>
            <p class="card-text mb-0">
              Habla sobre soluciones cotidianas desde cambiar una bombilla hasta cómo cambiar el sensor de aparcamiento de un BMW.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script de búsqueda -->
  <script src="script.js"></script>
</body>
</html>
